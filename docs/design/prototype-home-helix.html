<!doctype html>
<!--
  PROTOTYPE, throwaway. Not production code.
  Question: which melt material should the Home Helix use? (docs/frontend-structure.md, "Home Helix")
  Four sketches, switchable via ?melt=drip|fluid|glass|blobs, the yellow bar, or the ← → keys:
    drip   columns of pixels slide down at uneven speeds, like hot wax
    fluid  a fluid simulation the cursor and the turning stir; the picture smears like paint in water
    glass  the picture stays whole but warps through water and heat haze; the cursor drops ripples
    blobs  the picture breaks into soft blobs of colour that merge and pull apart
  Every sketch runs the whole Home: the Showreel full-bleed, the scroll zoom-out into the Helix,
  the timed melt (the point of no return), then the Helix (wheel, drag, ↑ ↓, click, Enter).
  One melt material does every job: the Showreel exit, the top and bottom edges, far cards,
  cards you aren't pointing at, and cards appearing during the zoom.
  Footage: procedural placeholder loops (timecode = it's a video). "Showreel…" and "Loops…"
  play your own MP4s; they stay on your machine.
  Camera (desktop only, opt-in): the index fingertip is the cursor (it explores: focus, ripples).
  Pinch index and thumb and move to scroll the zoom or turn the Helix; let go to release.
  A quick pinch (touch and part) clicks. Hand tracking is
  Google's MediaPipe gesture recognizer, loaded from jsDelivr and Google's model bucket on first
  use (~18 MB; production would self-host on R2). Video never leaves the browser.
  H hides the prototype chrome. Open by double-clicking. No network needed, except the camera's first load. Geometry and input come from the 21st.dev
  dither-helix-carousel; the dither look does not.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

  }

  *{box-sizing:border-box;margin:0;padding:0}

  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y;cursor:default}

  /* ---------- header (stays throughout) ---------- */

       justify-content:space-between;align-items:center;color:#fff;mix-blend-mode:difference;pointer-events:none}
  .logo b{font:800 clamp(14px,1.15vw,22px)/1 var(--sans);letter-spacing:-.01em}
  .menu-btn{font:400 clamp(15px,1.3vw,24px)/1 var(--serif)}

  /* ---------- hero text (leaves with the zoom) ---------- */
  .hero{position:fixed;inset:0;z-index:3;pointer-events:none;color:#fff;will-change:opacity,transform}
  .name{position:absolute;left:2.2vw;bottom:6vh;font:400 clamp(44px,7vw,140px)/.9 var(--serif);letter-spacing:-.02em}

         text-decoration:underline;color:#fff}

  /* ---------- Helix overlay (after the melt) ---------- */

       background:var(--proto);color:#111;border-radius:999px;padding:4px;font:600 12px/1 var(--mono);

  .panel{position:fixed;right:12px;bottom:90px;z-index:20;width:300px;max-height:calc(100vh - 120px);overflow:auto;
         background:var(--proto);color:#111;border-radius:10px;padding:12px 14px;font:12px/1.3 var(--mono);box-shadow:0 6px 24px #0006}
  .panel[hidden]{display:none}

         font:12px/1.3 var(--mono);padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}

       background:#000;box-shadow:0 6px 24px #0006}

<body>
<canvas id="gl" tabindex="0" aria-label="Öne çıkan işler"></canvas>
<div class="spacer" id="spacer"></div>

<header class="hdr"><span class="logo"><b>TAHA</b></span><span class="menu-btn">MENÜ</span></header>

<div class="hero" id="hero">
  <a class="sound" href="#" id="sound">Sesli izle</a>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const inOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function fail(msg) {
  const el = document.createElement('pre');
  el.className = 'err';
  el.textContent = msg;
  document.body.appendChild(el);
  console.error(msg);
}

/* =====================================================================================
   Geometry and input, from the dither-helix-carousel (16:9 cards, Y flipped so that
   scrolling down brings the next Work up from below).
   ===================================================================================== */
const CARD_H = 1.6, RADIUS = 3.8, RADIUS_STEP = 0.055, CAMERA_Z = 10, FOV = 48, NEAR = 0.1, FAR = 60;
const TWIST = 0.8, RISE = 0.79, RATIO = 16 / 9;
const WHEEL = 0.0022, DRAG = 0.007, FOLLOW = 4.7, WHEEL_IDLE = 110, CLICK_SLOP = 6;   // FOLLOW: 1/s, how fast the Helix follows input
const BEND = 2.7, BEND_EASE = 0.12, BEND_MAX = 0.07;
const HOVER_IN = 0.095, HOVER_OUT = 0.07, HOVER_SETTLE = 8, FOCUS_FALLOFF = 0.7, CLICK_MS = 1300;
const MIN_CARDS = 10;
const FOCAL = 1 / Math.tan((FOV * Math.PI) / 360);

/* =====================================================================================
   Sketches and their sliders
   ===================================================================================== */
const VARIANTS = [
  { key: 'drip', name: 'Drip', note: 'Columns of pixels slide down at uneven speeds, like hot wax. The Showreel runs down the screen column by column.',
    params: [
      { label: 'Drip length', min: 0.05, max: 0.9, step: 0.01, value: 0.4 },
      { label: 'Drip width (higher = thinner)', min: 6, max: 160, step: 1, value: 38 },
      { label: 'Turning speed → drip', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Cursor heat (moving cursor)', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'fluid', name: 'Fluid smear', note: 'A fluid simulation. The moving cursor and the turning stir it; the edges churn on their own; the picture heals back.',
    params: [
      { label: 'Cursor force', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Edge churn', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Heal speed', min: 0, max: 1, step: 0.01, value: 0.35 },
      { label: 'Swirl', min: 0, max: 1, step: 0.01, value: 0.45 },
    ] },
  { key: 'glass', name: 'Liquid glass', note: 'The picture stays whole but warps, as through water or heat haze. The cursor drops ripples; the Showreel dissolves in a ring from its centre.',
    params: [
      { label: 'Ripple strength', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Haze speed', min: 0, max: 2, step: 0.05, value: 0.6 },
      { label: 'Cursor ripples', min: 0, max: 2, step: 0.05, value: 0.35 },   // owner's pick
      { label: 'Colour split', min: 0, max: 2, step: 0.05, value: 0.7 },
    ] },
  { key: 'blobs', name: 'Liquefy into blobs', note: 'The picture breaks into soft blobs of colour that merge and pull apart, riding with the cards. The Showreel falls apart into drops.',
    params: [
      { label: 'Blob scale (higher = smaller)', min: 1, max: 12, step: 0.1, value: 4.5 },
      { label: 'Edge softness', min: 0.005, max: 0.15, step: 0.005, value: 0.035 },
      { label: 'Flow speed', min: 0, max: 2, step: 0.05, value: 0.6 },
      { label: 'Cursor heat (moving cursor)', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
];
for (const v of VARIANTS) v.values = v.params.map((p) => p.value);

const G = { band: 0.25, far: 0.7, dim: 0.55, meltDur: 1.3, scrollVh: 140, spin: 2.5, pullBack: true, tone: 'dark', camSens: 5, camPinch: 0.35, settle: 0.55 };
const TONES = { dark: [0.063, 0.063, 0.063], light: [0.925, 0.922, 0.906] };
const camCapable = matchMedia('(hover: hover) and (pointer: fine)').matches && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

/* =====================================================================================
   Placeholder footage: procedural 16:9 loops
   ===================================================================================== */
const SCENES = {
  night(c, t, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#04081a'); g.addColorStop(0.55, '#1a2858'); g.addColorStop(0.63, '#e0703a');
    g.addColorStop(0.67, '#1a1020'); g.addColorStop(1, '#07060c');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 46; i++) {
      const y = h * (0.68 + rnd(i) * 0.3);
      const sp = (80 + rnd(i + 9) * 420) * (rnd(i + 3) > 0.5 ? 1 : -1);
      const len = 40 + rnd(i + 5) * 180;
      const span = w + 400;
      const x = (((rnd(i + 1) * span + t * sp) % span) + span) % span - 200;
      c.strokeStyle = rnd(i + 7) > 0.4 ? 'rgba(255,70,40,.85)' : 'rgba(255,230,190,.85)';
      c.lineWidth = 1 + rnd(i + 2) * 4;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + len * Math.sign(sp), y); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
  },
  coast(c, t, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h * 0.6);
    g.addColorStop(0, '#ff9f7a'); g.addColorStop(0.6, '#f8d5ae'); g.addColorStop(1, '#9fd3cf');
    c.fillStyle = g; c.fillRect(0, 0, w, h * 0.6);
    c.fillStyle = '#fff3d1';
    c.beginPath(); c.arc(w * 0.68, h * (0.36 + Math.sin(t * 0.5) * 0.02), h * 0.12, 0, Math.PI * 2); c.fill();
    const s = c.createLinearGradient(0, h * 0.6, 0, h);
    s.addColorStop(0, '#1f7f93'); s.addColorStop(1, '#0a3442');
    c.fillStyle = s; c.fillRect(0, h * 0.6, w, h * 0.4);
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2;
    for (let k = 0; k < 14; k++) {
      const y = h * 0.62 + k * k * 1.6;
      c.beginPath();
      for (let x = 0; x <= w; x += 12) {
        const yy = y + Math.sin(x * 0.02 + t * (1 + k * 0.15) + k) * (2 + k * 0.4);
        x ? c.lineTo(x, yy) : c.moveTo(x, yy);
      }
      c.stroke();
    }
  },
  neon(c, t, w, h) {
    c.fillStyle = '#120018'; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 34; i++) {
      const x = w * (0.5 + 0.47 * Math.sin(t * 0.3 * (0.5 + rnd(i)) + i));
      const y = h * (0.5 + 0.44 * Math.cos(t * 0.23 * (0.5 + rnd(i + 4)) + i * 1.7));
      const r = 12 + rnd(i + 2) * 80;
      const flick = 0.22 + 0.12 * Math.sin(t * 6 + i);
      c.fillStyle = `hsla(${280 + rnd(i) * 120},100%,60%,${flick})`;
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
  },
  type(c, t, w, h) {
    c.fillStyle = '#f3d80b'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#111'; c.textBaseline = 'middle';
    c.font = `900 ${Math.round(h * 0.5)}px Helvetica, Arial, sans-serif`;
    const word = 'HAREKET  ';
    const tw = c.measureText(word).width;
    for (let x = -((t * h * 0.6) % tw); x < w; x += tw) c.fillText(word, x, h * 0.42);
    c.font = `700 ${Math.round(h * 0.11)}px Helvetica, Arial, sans-serif`;
    const w2 = 'KURGU · MOTION · GRAFİK  ';
    const tw2 = c.measureText(w2).width;
    for (let x = ((t * h * 0.3) % tw2) - tw2; x < w; x += tw2) c.fillText(w2, x, h * 0.84);
    c.textBaseline = 'alphabetic';
  },
  forest(c, t, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#d9ead9'); g.addColorStop(1, '#7fae8e');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const cols = ['#9cc3a5', '#6f9f7e', '#467a58', '#2a5a3c', '#123823'];
    for (let L = 0; L < 5; L++) {
      c.fillStyle = cols[L];
      c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += 8) {
        const y = h * (0.32 + L * 0.13) + Math.sin(x * (0.006 + L * 0.002) + t * 0.25 * (L + 1) + L) * h * 0.05
          + Math.sin(x * 0.021 + L * 3) * h * 0.02;
        c.lineTo(x, y);
      }
      c.lineTo(w, h); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(0, 0, w, h);
    }
  },
  red(c, t, w, h) {
    c.fillStyle = '#7e0b10'; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(0,0,0,.2)';
    for (let i = 0; i < 20; i++) c.fillRect(((i * 64 + t * 40) % (w + 64)) - 64, 0, 30, h);
    const r = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, h * 0.7);
    r.addColorStop(0, 'rgba(255,190,150,.45)'); r.addColorStop(1, 'rgba(255,190,150,0)');
    c.fillStyle = r; c.fillRect(0, 0, w, h);
    c.save(); c.translate(w / 2, h / 2); c.rotate(t * 0.6);
    c.fillStyle = '#f4efe8'; c.fillRect(-h * 0.17, -h * 0.17, h * 0.34, h * 0.34); c.restore();
  },
};
function timecode(c, t, w, h) {
  const s = Math.floor(t) % 60, f = Math.floor((t % 1) * 25);
  c.fillStyle = 'rgba(255,255,255,.8)';
  c.font = `600 ${Math.round(h * 0.045)}px ui-monospace, Menlo, monospace`;
  c.textAlign = 'right';
  c.fillText(`00:00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, w - h * 0.04, h - h * 0.05);
  c.textAlign = 'left';
}
const PLACEHOLDER_WORKS = [
  { title: 'Gece Sürüşü', disciplines: 'Kurgu · Motion', client: 'Atlas Otomotiv', slug: 'gece-surusu', scene: 'night' },
  { title: 'Kıyıda', disciplines: 'Kurgu', client: 'Ege Turizm', slug: 'kiyida', scene: 'coast' },
  { title: 'Neon', disciplines: 'Kurgu · Motion', client: 'Pulse Records', slug: 'neon', scene: 'neon' },
  { title: 'Hareket', disciplines: 'Motion · Grafik', client: 'Studio Kare', slug: 'hareket', scene: 'type' },
  { title: 'Orman', disciplines: 'Kurgu', client: 'Doğa Derneği', slug: 'orman', scene: 'forest' },
  { title: 'Kırmızı Oda', disciplines: 'Kurgu · Grafik', client: 'Sahne Tiyatrosu', slug: 'kirmizi-oda', scene: 'red' },
];
const SCENE_KEYS = Object.keys(SCENES);

/* =====================================================================================
   WebGL
   ===================================================================================== */
const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: false });
if (!gl) { fail('This prototype needs WebGL2.'); throw new Error('no webgl2'); }
const floatOk = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
const HALF = floatOk ? { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT } : {};

function compile(type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const numbered = src.split('\n').map((l, i) => `${String(i + 1).padStart(3)} ${l}`).join('\n');
    fail(`Shader "${label}" failed:\n${gl.getShaderInfoLog(s)}\n\n${numbered}`);
    return null;
  }
  return s;
}
function program(vs, fs, label) {
  const p = gl.createProgram();
  const a = compile(gl.VERTEX_SHADER, vs, label + ' (vs)'), b = compile(gl.FRAGMENT_SHADER, fs, label + ' (fs)');
  if (!a || !b) throw new Error('shader ' + label);

const float NEAR = ${NEAR.toFixed(2)};

    cameraOff();
    toast(`Camera blocked (${err.name}). Allow it for this page; Safari may need the file served from localhost.`);
    return;
  }
  if (!cam.on) { stopTracks(); return; }
  cam.video.srcObject = cam.stream;
  await cam.video.play().catch(() => {});
  $('#cam').hidden = false;
  if (!cam.recognizer) {
    setCam('loading hand tracking (~18 MB, first time)…');
    try { cam.recognizer = await loadRecognizer(); }
    catch (err) { console.error(err); cameraOff(); toast('Couldn’t load hand tracking: it needs internet the first time.'); return; }
  }
  if (cam.on) setCam('no hand');
}
function cameraOff() {
  cam.on = false; stopTracks(); cam.video.srcObject = null;
  $('#cam').hidden = true; releasePtr();
  cam.pinched = false; cam.pstreak = 0; cam.y = null; cam.fx = cam.fy = null; cam.lastTime = -1; cam.hist = [];
  setCam('off');
}
$('#cam-btn').addEventListener('click', () => (cam.on ? cameraOff() : cameraOn()));
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.on) cameraOff(); });

function drawHand(lm) {
  const c = $('#cam-draw').getContext('2d'), w = 320, h = 240;
  c.clearRect(0, 0, w, h);
  if (!lm) return;
  c.fillStyle = 'rgba(255,255,255,.8)';
  for (const p of lm) { c.beginPath(); c.arc(p.x * w, p.y * h, 3, 0, Math.PI * 2); c.fill(); }
  c.strokeStyle = cam.pinched ? '#ffd84d' : 'rgba(255,255,255,.5)'; c.lineWidth = cam.pinched ? 4 : 1.5;
  c.beginPath(); c.moveTo(lm[4].x * w, lm[4].y * h); c.lineTo(lm[8].x * w, lm[8].y * h); c.stroke();
  c.fillStyle = cam.pinched ? '#ffd84d' : '#fff';
  c.beginPath(); c.arc(lm[8].x * w, lm[8].y * h, 6, 0, Math.PI * 2); c.fill();
}
function flashClick() {
  const dot = $('#finger');
  dot.classList.remove('click'); void dot.offsetWidth; dot.classList.add('click');
}
/* Pinch starts: the grab holds on to where the cursor was just before the fingers began to close,
   so closing them doesn't drag the target away. */
function startPinch(now, mid) {
  const back = cam.hist.find((h) => h.t >= now - 120) || cam.hist[0] || { x: mid.x, y: mid.y };
  cam.off = { x: back.x - mid.x, y: back.y - mid.y };
  cam.pinched = true; cam.pinchAt = now; cam.travel = 0; cam.y = null;
}
/* Pinch ends: a quick one that barely moved is a click. Otherwise it was a grab, and the Helix
   settles on its own (snapping). The cursor eases back from the pinch point to the fingertip. */
function endPinch(now, tip, allowClick) {
  if (!cam.pinched) return;
  cam.pinched = false; cam.y = null; cam.releasedAt = now;
  cam.off = tip && cam.last ? { x: cam.last.x - tip.x, y: cam.last.y - tip.y } : { x: 0, y: 0 };
  if (allowClick && now - cam.pinchAt < CLICK_MS_CAM && cam.travel < CLICK_TRAVEL_CAM) { flashClick(); clickAt(ptr.x, ptr.y); }
}
function camStep(now) {
  if (!cam.on || !cam.recognizer || cam.video.readyState < 2 || cam.video.currentTime === cam.lastTime) return;
  cam.lastTime = cam.video.currentTime;
  let res;
  try { res = cam.recognizer.recognizeForVideo(cam.video, now); } catch (err) { console.error(err); return; }
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) {
    drawHand(null);
    if (++cam.miss > 4) { endPinch(now, null, false); cam.fx = cam.fy = null; cam.hist = []; releasePtr(); }
    setCam('no hand');
    return;
  }
  cam.miss = 0;
  // Pinch: the thumb–index gap relative to the palm (wrist to index knuckle), in camera pixels. Hysteresis
  // (closes below the threshold, opens above 1.5×) and two frames in a row before it counts.
  const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * 640, (lm[a].y - lm[b].y) * 480);
  cam.ratio = d(4, 8) / Math.max(d(0, 5), 1);
  const closed = cam.pinched ? cam.ratio < G.camPinch * 1.5 : cam.ratio < G.camPinch;
  cam.pstreak = closed === cam.pinched ? 0 : cam.pstreak + 1;
  const tip = { x: 1 - lm[8].x, y: lm[8].y };                                     // mirrored
  const mid = { x: 1 - (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 };
  if (cam.pstreak >= 2) { cam.pstreak = 0; if (cam.pinched) endPinch(now, tip, true); else startPinch(now, mid); }
  drawHand(lm);
  // The cursor: the fingertip while exploring, the pinch point (anchored) while grabbing.
  let cx, cy;
  if (cam.pinched) { cx = mid.x + cam.off.x; cy = mid.y + cam.off.y; }
  else { const k = Math.max(0, 1 - (now - cam.releasedAt) / 200); cx = tip.x + cam.off.x * k; cy = tip.y + cam.off.y * k; }
  if (!cam.fx) { cam.fx = oneEuro(); cam.fy = oneEuro(); }
  const fx = cam.fx(cx, now), fy = cam.fy(cy, now);
  cam.last = { x: fx, y: fy };
  cam.hist.push({ t: now, x: fx, y: fy }); if (cam.hist.length > 12) cam.hist.shift();
  ptr.x = clamp((fx - 0.15) / 0.7, 0, 1) * cssW; ptr.y = clamp((fy - 0.12) / 0.76, 0, 1) * cssH; cam.ownsPtr = true;
  const dot = $('#finger');
  dot.hidden = false; dot.style.transform = `translate(${ptr.x}px, ${ptr.y}px)`; dot.classList.toggle('pinched', cam.pinched);
  // Grab: while pinched, vertical movement scrolls the zoom or turns the Helix, like a mouse drag.
  if (cam.pinched) {
    if (cam.y !== null) {
      const raw = cam.y - fy;                    // up = positive = content up
      cam.travel += Math.abs(raw);
      const dy = raw * G.camSens;
      if (phase === 'hero') scrollBy(0, dy * innerHeight * 0.6);
      else if (Math.abs(dy) > 0.0005) nudge(dy, 'drag');
    }
    cam.y = fy;
  }
  setCam(`${cam.pinched ? 'pinched → grab' : 'exploring'} · pinch ${cam.ratio.toFixed(2)}`);
}

/* =====================================================================================
   Frame
   ===================================================================================== */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - lastNow) / 1000 || 1 / 60, 1 / 240, 1 / 30);
  lastNow = now;
  if (!W) return;
  const n = cards.length;
  const v = VARIANTS[cur];

  // --- phase: scrubbed zoom → timed melt → committed Helix
  if (phase === 'hero') {
    sSmooth += (clamp(sTarget, 0, 1) - sSmooth) * (1 - Math.exp(-dt * 7));   // time-based: same feel at any frame rate
    if (sTarget >= 0.995 && sSmooth > 0.95) { sSmooth = 1; phase = 'melt'; meltStart = now; meltKick = true; lock(); }
  }
  if (phase === 'melt') {
    meltP = clamp((now - meltStart) / (G.meltDur * 1000), 0, 1);
    if (meltP >= 1) { phase = 'helix'; lock(); }
  }
  const zoom = phase === 'hero' ? sSmooth : 1;
  const e = smooth(zoom);
  const helixScale = G.pullBack ? Math.pow(S0, 1 - e) : 1;

  // --- turning
  const before = progress;
  if (phase === 'hero') { goal = 0; progress = -G.spin * (1 - e); }
  else {                         // melt and helix: the Helix turns from the moment the melt starts
    if (tween) {
      const t = clamp((now - tween.at) / CLICK_MS, 0, 1);
      goal = tween.from + (tween.to - tween.from) * inOutCubic(t);
      if (t >= 1) tween = null;
    }
    // Input has ended: right away after a drag or pinch, after a short gap for the wheel.
    const holding = dragFrom !== null || cam.pinched;
    if (!tween && !snapped && !holding && now - lastInput > (lastKind === 'wheel' ? WHEEL_IDLE : 0)) startSettle();
    if (settling) {
      const w = 4.6 / G.settle;                  // settles in about G.settle seconds
      pv += (w * w * (settleTo - progress) - 2 * w * pv) * dt;
      progress += pv * dt;
      goal = settleTo;
      if (Math.abs(settleTo - progress) < 1e-4 && Math.abs(pv) < 1e-3) { progress = settleTo; pv = 0; settling = false; }
    } else {
      const p0 = progress;
      progress += (goal - progress) * (1 - Math.exp(-dt * FOLLOW));
      pv = (progress - p0) / dt;
    }
  }
  velocity = progress - before;
  smoothed += (clamp(velocity, -BEND_MAX, BEND_MAX) - smoothed) * BEND_EASE;
  const speed = clamp(Math.abs(smoothed) / BEND_MAX, 0, 1);
  const dir = Math.sign(smoothed);
  front = (((Math.round(phase === 'hero' ? 0 : goal)) % n) + n) % n;

  camStep(now);

  // --- pointer
  movedPx = ptr.x >= 0 && ptrFrame.x >= 0 ? Math.hypot(ptr.x - ptrFrame.x, ptr.y - ptrFrame.y) : 0;
  ptrUvLast = ptrFrame.x >= 0 ? [ptrFrame.x / cssW, 1 - ptrFrame.y / cssH] : [ptr.x / cssW, 1 - ptr.y / cssH];
  ptrUv = [ptr.x / cssW, 1 - ptr.y / cssH];
  ptrFrame.x = ptr.x; ptrFrame.y = ptr.y;
  pointerSpeed = Math.max(movedPx, pointerSpeed * 0.8);

  // --- focus
  if (phase !== 'hero' && ptr.x >= 0 && pointerSpeed < HOVER_SETTLE && dragFrom === null && !cam.pinched) hovered = pick(ptr.x, ptr.y);
  if (phase === 'hero') hovered = -1;
  for (let i = 0; i < n; i++) {
    const wantHover = i === hovered ? 1 : 0;
    hover[i] += (wantHover - hover[i]) * (wantHover > hover[i] ? HOVER_IN : HOVER_OUT);
    let wantDim = 0;
    if (hovered >= 0) { let gap = Math.abs(i - hovered); gap = Math.min(gap, n - gap); wantDim = clamp(gap / FOCUS_FALLOFF, 0, 1); }
    dim[i] += (wantDim - dim[i]) * (wantDim > dim[i] ? HOVER_IN : HOVER_OUT);
    entry[i] = phase === 'hero' ? 1 - clamp((zoom - delay[i]) / 0.35, 0, 1) : 0;
  }

  // --- media: only cards in the sharp middle band play (the rest hold a still frame)
  const t = now / 1000;
  const playingWork = new Set();
  if (phase !== 'hero') for (let i = 0; i < n; i++) if (Math.abs(slotOf(i)) < 1.6 || i === hovered) playingWork.add(cards[i].work);
  playing = playingWork.size;
  works.forEach((w, wi) => {
    const on = playingWork.has(wi);
    if (w.video) {
      if (on && w.video.paused) w.video.play().catch(() => {});
      if (!on && !w.video.paused) w.video.pause();
      if (w.video.readyState >= 2 && (on || !w.uploaded)) { upload(w.tex, w.video); w.uploaded = true; }
    } else if (on) {
      SCENES[w.scene](w.ctx, t + w.offset, 512, 288); timecode(w.ctx, t + w.offset, 512, 288); upload(w.tex, w.canvas);
    }
  });
  if (phase !== 'helix') {
    if (showreel.video) { if (showreel.video.readyState >= 2) upload(showreel.tex, showreel.video); }
    else { drawShowreel(t); upload(showreel.tex, showreel.canvas); }
  }

  const bg = TONES[G.tone];
  const asp = cssW / cssH;
  const slotUv = ((RISE * CARD_H * focalK) / (CAMERA_Z - RADIUS)) * 0.5;
  const shift = progress * slotUv;

  // --- pass 1: the cards
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.DEPTH_TEST);
  gl.clearBufferfv(gl.COLOR, 0, [bg[0], bg[1], bg[2], 1]);
  gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 0]);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  const C = progs.card.use();
  gl.bindVertexArray(cardMesh);
  C.f('uCount', n).f('uProgress', progress).f('uAngleStep', TWIST).f('uPitch', RISE * CARD_H).f('uVelocity', smoothed)
    .f('uCard', CARD_H * RATIO, CARD_H).f('uFocal', focalK).f('uAspect', asp).f('uScale', helixScale).f('uBg', bg[0], bg[1], bg[2]);
  for (let i = 0; i < n; i++) {
    const w = works[cards[i].work];
    C.tex('uMap', w.tex, 0).f('uIndex', i).f('uHover', hover[i]).f('uDim', dim[i]).f('uEntry', entry[i])
      .f('uImageRatio', w.aspect < RATIO ? 1 : RATIO / w.aspect, w.aspect < RATIO ? w.aspect / RATIO : 1);
    gl.drawArrays(gl.TRIANGLES, 0, cardVertexCount);
  }
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex); gl.generateMipmap(gl.TEXTURE_2D);

  // --- pass 2: the Showreel layer
  gl.bindFramebuffer(gl.FRAMEBUFFER, reelT.fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (phase !== 'helix') {
    const ra = showreel.aspect;
    const s0 = asp > ra ? [1, ra / asp] : [asp / ra, 1];
    const s1 = RATIO > ra ? [1, ra / RATIO] : [RATIO / ra, 1];
    progs.reel.use().tex('uMap', showreel.tex, 0).f('uCard', CARD_H * RATIO, CARD_H).f('uFocal', focalK).f('uAspect', asp)
      .f('uZoom', e).f('uHelixScale', helixScale).f('uScale0', s0[0], s0[1]).f('uScale1', s1[0], s1[1])
      .f('uSlot', phase === 'melt' ? slotOf(0) : 0).f('uAngleStep', TWIST).f('uPitch', RISE * CARD_H);
    gl.bindVertexArray(cardMesh);
    gl.drawArrays(gl.TRIANGLES, 0, cardVertexCount);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, reelT.tex); gl.generateMipmap(gl.TEXTURE_2D);

  // --- pass 3: the sketch's simulation
  const P = v.values;
  const strength = clamp(movedPx / 30, 0, 1);
  const sim = simFor(v.key);
  let simTex, simTexel = [1, 1];
  if (v.key === 'drip' || v.key === 'blobs') {
    progs.trail.use().tex('uState', sim.read.tex, 0).f('uTexel', 1 / sim.w, 1 / sim.h).f('uA', ...ptrUvLast).f('uB', ...ptrUv)
      .f('uStrength', ptr.x >= 0 ? strength * 0.6 : 0).f('uRadius', 0.05).f('uDecay', 0.965).f('uAspect', asp);
    drawQuad(sim.write); sim.swap(); simTex = sim.read.tex;
  } else if (v.key === 'glass') {
    for (let k = 0; k < 2; k++) {
      let cPt = [-9, -9], cStr = 0;
      if (meltKick && k === 0) { cPt = [0.5, 0.5]; cStr = -0.8; }
      else if (Math.random() < speed * 0.6) { cPt = [Math.random(), Math.random() < 0.5 ? Math.random() * 0.25 : 1 - Math.random() * 0.25]; cStr = -0.08 * speed; }
      progs.wave.use().tex('uState', sim.read.tex, 0).f('uTexel', 1 / sim.w, 1 / sim.h).f('uA', ...ptrUvLast).f('uB', ...ptrUv)
        .f('uStrength', ptr.x >= 0 && k === 0 ? -strength * 0.12 * P[2] : 0).f('uRadius', 0.018).f('uDamp', 0.975)
        .f('uAspect', asp).f('uC', cPt[0], cPt[1]).f('uCStrength', cStr);
      drawQuad(sim.write); sim.swap();
    }
    simTex = sim.read.tex; simTexel = [1 / sim.w, 1 / sim.h];
  } else {
    stepFluid(sim, dt, P, speed, dir, shift, now);
    simTex = sim.disp.read.tex;
  }
  meltKick = false;

  // --- pass 4: composite with the melt material
  const M = progs[v.key].use();
  M.tex('uScene', scene.tex, 0).tex('uMeta', scene.meta, 1).tex('uReel', reelT.tex, 2).tex('uSim', simTex, 3);
  meltUniforms(M, now, speed, dir, shift);
  M.f('uSimTexel', simTexel[0], simTexel[1]).f('uBg', bg[0], bg[1], bg[2]).f('uMelt', phase === 'melt' ? meltP : phase === 'helix' ? 1 : 0)
    .f('uReelOn', phase === 'helix' ? 0 : 1).f('uP', P[0], P[1], P[2], P[3]);
  const reelAt0 = phase === 'melt' ? project(0) : null;
  M.f('uReelCenter', reelAt0 ? reelAt0.x / cssW : 0.5, reelAt0 ? 1 - reelAt0.y / cssH : 0.5);
  drawQuad(null);

  // --- DOM overlays
  const hero = $('#hero');
  hero.style.opacity = String(1 - smooth(clamp(zoom / 0.35, 0, 1)));
  hero.style.transform = `translateY(${zoom * 40}px)`;
  const wk = works[cards[front].work];
  $('#work').classList.toggle('on', phase === 'helix' || (phase === 'melt' && meltP > 0.5));
  if ($('#w-title').textContent !== wk.title) {
    $('#w-title').textContent = wk.title;
    $('#w-meta').textContent = `${wk.disciplines} — ${wk.client}`;
  }
  $('#w-count').innerHTML = `${String(cards[front].work + 1).padStart(2, '0')}<i> / ${String(works.length).padStart(2, '0')}</i>`;
  $('#state').textContent = `${String.fromCharCode(65 + cur)} ${v.name} · ${phase} · scroll ${clamp(sTarget, 0, 1).toFixed(2)} · zoom ${zoom.toFixed(2)} · melt ${meltP.toFixed(2)} · speed ${speed.toFixed(2)} · front ${cards[front].work + 1}/${works.length} · hover ${hovered >= 0 ? cards[hovered].work + 1 : '–'} · playing ${playing} · ${n} cards${cam.on ? ' · cam ' + cam.status : ''}${floatOk ? '' : ' · NO FLOAT TARGETS'}`;
}

function meltUniforms(M, now, speed, dir, shift) {
  M.f('uRes', W, H).f('uBand', G.band).f('uFar', G.far).f('uDim', G.dim).f('uTime', now / 1000).f('uSpeed', speed).f('uDir', dir).f('uShift', shift);
}

function stepFluid(F, dt, P, speed, dir, shift, now) {
  const texel = [1 / F.w, 1 / F.h], asp = cssW / cssH;
  const ch = progs.fl_churn.use();
  ch.tex('uVel', F.vel.read.tex, 0).tex('uScene', scene.tex, 1).tex('uMeta', scene.meta, 2).tex('uReel', reelT.tex, 3);
  meltUniforms(ch, now, speed, dir, shift);
  ch.f('uDt', dt).f('uChurn', 220 * P[1]).f('uTurn', 1800).f('uMeltForce', phase === 'melt' ? Math.sin(Math.PI * meltP) * 1800 : 0);
  drawQuad(F.vel.write); F.vel.swap();
  if (ptr.x >= 0 && movedPx > 0) {
    const dx = (ptrUv[0] - ptrUvLast[0]) * 6000 * P[0], dy = (ptrUv[1] - ptrUvLast[1]) * 6000 * P[0];
    progs.fl_splat.use().tex('uTarget', F.vel.read.tex, 0).f('uPoint', ...ptrUv).f('uColor', dx, dy, 0).f('uRadius', 0.0025).f('uAspect', asp);
    drawQuad(F.vel.write); F.vel.swap();
  }
  progs.fl_curl.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel); drawQuad(F.curl);
  progs.fl_vort.use().tex('uVel', F.vel.read.tex, 0).tex('uCurl', F.curl.tex, 1).f('uTexel', ...texel).f('uCurlStrength', 60 * P[3]).f('uDt', dt);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_div.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel); drawQuad(F.div);
  progs.fl_scale.use().tex('uSrc', F.pressure.read.tex, 0).f('uK', 0.8); drawQuad(F.pressure.write); F.pressure.swap();
  const pr = progs.fl_pressure.use();
  for (let i = 0; i < 20; i++) {
    pr.tex('uPressure', F.pressure.read.tex, 0).tex('uDiv', F.div.tex, 1).f('uTexel', ...texel);
    drawQuad(F.pressure.write); F.pressure.swap();
  }
  progs.fl_grad.use().tex('uPressure', F.pressure.read.tex, 0).tex('uVel', F.vel.read.tex, 1).f('uTexel', ...texel);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_advVel.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel).f('uDt', dt).f('uDiss', 2.5);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_advDisp.use().tex('uVel', F.vel.read.tex, 0).tex('uD', F.disp.read.tex, 1).f('uTexel', ...texel).f('uDt', dt).f('uRelax', 0.8 + P[2] * 6);
  drawQuad(F.disp.write); F.disp.swap();
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0);
resize();
requestAnimationFrame(frame);
window.__proto = { get phase() { return phase; }, get variant() { return VARIANTS[cur].key; }, setVariant, replay };
</script>
</body>
</html>
