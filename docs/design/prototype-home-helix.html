<!doctype html>
<!--
  PROTOTYPE, throwaway. Not production code.
  Question: which melt material should the Home Helix use? (docs/frontend-structure.md, "Home Helix")
  Seventeen sketches, switchable via ?melt=drip|fluid|glass|blobs|burn|halftone|exposure|focus|datamosh|signal|paper|burndeckle|glyphs|grain|ink|mosaic|shards,
  the yellow bar, or the ← → keys. The last thirteen (the "edge" materials) share the EDGE chunk: an organic outline band
  on every card. See docs/research/helix-material-ideas.md.
    drip   columns of pixels slide down at uneven speeds, like hot wax
    fluid  a fluid simulation the cursor and the turning stir; the picture smears like paint in water
    glass  the picture stays whole but warps through water and heat haze; the cursor drops ripples
    blobs  the picture breaks into soft blobs of colour that merge and pull apart
  Every sketch runs the whole Home: the Showreel full-bleed, the scroll zoom-out into the Helix,
  the timed melt (the point of no return), then the Helix (wheel, drag, ↑ ↓, click, Enter).
  One melt material does every job: the Showreel exit, the top and bottom edges, far cards,
  cards you aren't pointing at, and cards appearing during the zoom.
  Footage: procedural placeholder loops (timecode = it's a video). "Showreel…" and "Loops…"
  play your own MP4s; they stay on your machine.
  Camera (desktop only, opt-in): the index fingertip is the cursor (it explores: focus, ripples).
  Pinch index and thumb and move to scroll the zoom or turn the Helix; let go to release.
  A quick pinch (touch and part) clicks. Hand tracking is
  Google's MediaPipe gesture recognizer, loaded from jsDelivr and Google's model bucket on first
  use (~18 MB; production would self-host on R2). Video never leaves the browser.
  H hides the prototype chrome. Open by double-clicking. No network needed, except the camera's first load. Geometry and input come from the 21st.dev
  dither-helix-carousel; the dither look does not.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTİP · Ana sayfa sarmalı</title>
<style>
  :root{
    --bg:#101010; --fg:#f2f2f2; --mute:#9a9a9a;
    --serif:"Times New Roman",Times,serif;            /* stand-in for the display serif */
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; /* stand-in for the grotesk */
    --mono:ui-monospace,Menlo,monospace;
    --proto:#ffd84d;
  }
  html[data-tone="light"]{ --bg:#ecebe7; --fg:#141414; --mute:#5c5c5c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);color:var(--fg)}
  body{font-family:var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased}
  html.locked,html.locked body{overflow:hidden;height:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y;cursor:default}
  html.locked #gl{touch-action:none;cursor:grab}
  html.locked #gl:active{cursor:grabbing}
  .spacer{height:240vh;pointer-events:none}

  /* ---------- header (stays throughout) ---------- */
  .hdr{position:fixed;inset:0 0 auto 0;z-index:5;height:8.6vh;min-height:52px;padding:0 2.1vw;display:flex;
       justify-content:space-between;align-items:center;color:#fff;mix-blend-mode:difference;pointer-events:none}
  .logo b{font:800 clamp(14px,1.15vw,22px)/1 var(--sans);letter-spacing:-.01em}
  .menu-btn{font:400 clamp(15px,1.3vw,24px)/1 var(--serif)}

  /* ---------- hero text (leaves with the zoom) ---------- */
  .hero{position:fixed;inset:0;z-index:3;pointer-events:none;color:#fff;will-change:opacity,transform}
  .name{position:absolute;left:2.2vw;bottom:6vh;font:400 clamp(44px,7vw,140px)/.9 var(--serif);letter-spacing:-.02em}
  .copy{position:absolute;left:2.7vw;bottom:3vh;font:400 clamp(10px,.72vw,14px)/1 var(--sans);opacity:.85}
  .statement{position:absolute;left:62.5vw;right:2.5vw;bottom:5vh;font:400 clamp(15px,2.1vw,40px)/1.1 var(--serif);letter-spacing:-.01em}
  .sound{position:absolute;right:2.5vw;top:12vh;font:400 clamp(12px,.9vw,16px)/1 var(--sans);pointer-events:auto;
         text-decoration:underline;color:#fff}
  @media (max-width:700px){ .statement{left:2.2vw;bottom:auto;top:62vh;right:6vw} }

  /* ---------- Helix overlay (after the melt) ---------- */
  .work{position:fixed;inset:auto 0 0 0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s}
  .work.on{opacity:1}
  .work .title{position:absolute;left:2.2vw;bottom:9vh;font:400 clamp(28px,3.2vw,60px)/1 var(--serif);letter-spacing:-.01em}
  .work .meta{position:absolute;left:2.4vw;bottom:5.6vh;font:400 clamp(11px,.9vw,15px)/1 var(--sans);color:var(--mute)}
  .work .count{position:absolute;right:2.5vw;bottom:5.6vh;font:400 clamp(12px,1vw,16px)/1 var(--sans);color:var(--mute);font-variant-numeric:tabular-nums}
  .work .count i{font-style:normal;opacity:.5}

  /* ---------- prototype chrome (not part of the design) ---------- */
  .bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;
       background:var(--proto);color:#111;border-radius:999px;padding:4px;font:600 12px/1 var(--mono);
       box-shadow:0 6px 24px #0006;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
  .bar button,.bar label{padding:8px 10px;border-radius:999px;cursor:pointer}
  .bar button:hover,.bar label:hover{background:#0001}
  .bar .label{padding:0 6px;min-width:13em;text-align:center}
  .bar .sep{width:1px;height:18px;background:#0003;margin:0 4px}
  .bar input[type=file]{display:none}
  .state{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:20;font:11px/1.3 var(--mono);color:#111;
         background:#ffd84dd9;padding:4px 8px;border-radius:4px;white-space:nowrap;max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis}
  .panel{position:fixed;right:12px;bottom:90px;z-index:20;width:300px;max-height:calc(100vh - 120px);overflow:auto;
         background:var(--proto);color:#111;border-radius:10px;padding:12px 14px;font:12px/1.3 var(--mono);box-shadow:0 6px 24px #0006}
  .panel[hidden]{display:none}
  .panel h3{font:700 12px/1 var(--mono);margin:12px 0 6px}
  .panel h3:first-child{margin-top:0}
  .panel p{margin:0 0 8px;opacity:.75}
  .panel label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:6px 0}
  .panel label input[type=range]{grid-column:1 / -1;width:100%}
  .panel output{font-variant-numeric:tabular-nums}
  .panel .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .toast{position:fixed;left:50%;top:12vh;transform:translateX(-50%);z-index:30;background:#111;color:#fff;
         font:12px/1.3 var(--mono);padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
  .err{position:fixed;inset:20px;z-index:40;background:#300;color:#fdd;font:12px/1.4 var(--mono);padding:16px;overflow:auto;white-space:pre-wrap}
  html.bare .bar,html.bare .state,html.bare .panel{display:none}
  .bar button.active{background:#111;color:var(--proto)}
  .cam{position:fixed;left:12px;top:calc(max(8.6vh,52px) + 8px);z-index:20;width:200px;border-radius:8px;overflow:hidden;
       background:#000;box-shadow:0 6px 24px #0006}
  .cam .mirror{position:relative;transform:scaleX(-1)}
  .cam video{display:block;width:100%;height:auto}
  .cam canvas{position:absolute;inset:0;width:100%;height:100%}
  .cam p{font:11px/1.3 var(--mono);background:var(--proto);color:#111;padding:4px 6px}
  .finger{position:fixed;left:-14px;top:-14px;width:28px;height:28px;border:2px solid #fff;border-radius:50%;
          mix-blend-mode:difference;z-index:21;pointer-events:none;transition:background-color .15s}
  .finger.pinched{background:#fff}
  .finger.click::before{content:'';position:absolute;inset:-12px;border:2px solid #fff;border-radius:50%;animation:ping .35s ease-out forwards}
  @keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
  @media (max-width:700px){ .state{display:none} }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Öne çıkan işler"></canvas>
<div class="spacer" id="spacer"></div>

<header class="hdr"><span class="logo"><b>TAHA</b></span><span class="menu-btn">MENÜ</span></header>

<div class="hero" id="hero">
  <a class="sound" href="#" id="sound">Sesli izle</a>
  <div class="name">Taha Çiftçi</div>
  <div class="copy">© 2026 Taha Çiftçi. Tüm hakları saklıdır.</div>
  <p class="statement">Kurgu ve hareketle marka hikâyeleri anlatan bağımsız bir yapımcı. (yer tutucu)</p>
</div>

<div class="work" id="work" aria-live="polite">
  <div class="title" id="w-title"></div>
  <div class="meta" id="w-meta"></div>
  <div class="count" id="w-count"></div>
</div>

<div class="state" id="state"></div>
<div class="bar" role="toolbar" aria-label="Prototype">

  <button id="next" title="Next sketch (→)">›</button>
  <span class="sep"></span>
  <button id="toggle">Sliders</button>
  <button id="replay" title="Back to the Showreel">↺ Showreel</button>
  <label>Showreel…<input type="file" accept="video/*" id="reel-file"></label>
  <label>Loops…<input type="file" accept="video/*" multiple id="loop-files"></label>
  <button id="cam-btn" title="Steer with your index finger (desktop)">Camera</button>
</div>
<div class="cam" id="cam" hidden>
  <div class="mirror"><video id="cam-video" muted playsinline></video><canvas id="cam-draw" width="320" height="240"></canvas></div>
  <p>camera on · <span id="cam-status">off</span></p>
</div>
<div class="finger" id="finger" hidden></div>
<div class="panel" id="panel" hidden></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const inOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function fail(msg) {
  const el = document.createElement('pre');
  el.className = 'err';
  el.textContent = msg;
  document.body.appendChild(el);
  console.error(msg);
}

/* =====================================================================================
   Geometry and input, from the dither-helix-carousel (16:9 cards, Y flipped so that
   scrolling down brings the next Work up from below).
   ===================================================================================== */
const CARD_H = 1.6, RADIUS = 3.8, RADIUS_STEP = 0.055, CAMERA_Z = 10, FOV = 48, NEAR = 0.1, FAR = 60;
const TWIST = 0.8, RISE = 0.79, RATIO = 16 / 9;
const WHEEL = 0.0022, DRAG = 0.007, FOLLOW = 4.7, WHEEL_IDLE = 110, CLICK_SLOP = 6;   // FOLLOW: 1/s, how fast the Helix follows input
const BEND = 2.7, BEND_EASE = 0.12, BEND_MAX = 0.07;
const HOVER_IN = 0.095, HOVER_OUT = 0.07, HOVER_SETTLE = 8, FOCUS_FALLOFF = 0.7, CLICK_MS = 1300;
const MIN_CARDS = 10;
const FOCAL = 1 / Math.tan((FOV * Math.PI) / 360);

/* =====================================================================================
   Sketches and their sliders
   ===================================================================================== */
const VARIANTS = [
  { key: 'drip', name: 'Drip', note: 'Columns of pixels slide down at uneven speeds, like hot wax. The Showreel runs down the screen column by column.',
    params: [
      { label: 'Drip length', min: 0.05, max: 0.9, step: 0.01, value: 0.4 },
      { label: 'Drip width (higher = thinner)', min: 6, max: 160, step: 1, value: 38 },
      { label: 'Turning speed → drip', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Cursor heat (moving cursor)', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'fluid', name: 'Fluid smear', note: 'A fluid simulation. The moving cursor and the turning stir it; the edges churn on their own; the picture heals back.',
    params: [
      { label: 'Cursor force', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Edge churn', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Heal speed', min: 0, max: 1, step: 0.01, value: 0.35 },
      { label: 'Swirl', min: 0, max: 1, step: 0.01, value: 0.45 },
    ] },
  { key: 'glass', name: 'Liquid glass', note: 'The picture stays whole but warps, as through water or heat haze. The cursor drops ripples; the Showreel dissolves in a ring from its centre.',
    params: [
      { label: 'Ripple strength', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Haze speed', min: 0, max: 2, step: 0.05, value: 0.6 },
      { label: 'Cursor ripples', min: 0, max: 2, step: 0.05, value: 0.35 },   // owner's pick
      { label: 'Colour split', min: 0, max: 2, step: 0.05, value: 0.7 },
    ] },
  { key: 'blobs', name: 'Liquefy into blobs', note: 'The picture breaks into soft blobs of colour that merge and pull apart, riding with the cards. The Showreel falls apart into drops.',
    params: [
      { label: 'Blob scale (higher = smaller)', min: 1, max: 12, step: 0.1, value: 4.5 },
      { label: 'Edge softness', min: 0.005, max: 0.15, step: 0.005, value: 0.035 },
      { label: 'Flow speed', min: 0, max: 2, step: 0.05, value: 0.6 },
      { label: 'Cursor heat (moving cursor)', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  /* Edge materials (edge: true): compiled with the EDGE chunk (organic outline) and driven by the cursor trail's heat. */
  { key: 'burn', name: 'Film burn', edge: true, note: 'The picture burns away along a ragged, glowing ember front, scorched and warm before it goes. The Showreel burns out from its centre in a ring.',
    params: [
      { label: 'Ember width', min: 0.01, max: 0.12, step: 0.005, value: 0.045 },
      { label: 'Burn noise scale (higher = finer)', min: 1, max: 10, step: 0.1, value: 4.5 },
      { label: 'Flicker (more with turning speed)', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Cursor heat (moving cursor)', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'halftone', name: 'Halftone print', edge: true, note: 'The melt is a print breaking up: the picture turns into RGB dots that coarsen and shrink to paper. Card outlines break into dots. The Showreel prints away in a ring of big dots.',
    params: [
      { label: 'Dot grid size', min: 0.004, max: 0.02, step: 0.001, value: 0.008 },
      { label: 'Coarsening as it melts', min: 0, max: 3, step: 0.05, value: 1.2 },
      { label: 'Colour plate slip with turning speed', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Ink swell under the cursor', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'exposure', name: 'Long exposure', edge: true, note: 'Light drags: cards leaving the sharp band stretch into streaks, longer with turning speed. The Showreel is drawn out into rays from its centre.',
    params: [
      { label: 'Streak length', min: 0.02, max: 0.4, step: 0.01, value: 0.14 },
      { label: 'Turning speed → streak', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Afterglow (light trails)', min: 0, max: 1.5, step: 0.05, value: 0.8 },
      { label: 'Cursor trail', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'focus', name: 'Rack focus', edge: true, note: 'The sharp band is in focus; everything else defocuses into bokeh discs before it fades. The pointer pulls focus. The Showreel defocuses in a ring.',
    params: [
      { label: 'Max blur radius', min: 0.01, max: 0.07, step: 0.001, value: 0.035 },
      { label: 'Bokeh highlights', min: 0, max: 8, step: 0.1, value: 4 },
      { label: 'Turning speed → blur', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Cursor pulls focus', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'datamosh', name: 'Datamosh', edge: true, note: 'A codec failure: blocks lock, posterise and drift off, each on its own schedule. The cursor makes blocks stutter. The Showreel breaks into blocks that slide off in a ring.',
    params: [
      { label: 'Block size', min: 0.015, max: 0.08, step: 0.001, value: 0.035 },
      { label: 'Block drift', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Turning speed → drift', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Cursor stutter', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'signal', name: 'Analogue signal', edge: true, note: 'A signal failing: line jitter, chroma bleed, a rolling tracking band and tape noise. The Showreel drops out line by line in a ring.',
    params: [
      { label: 'Line jitter', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Chroma bleed', min: 0, max: 3, step: 0.05, value: 1 },
      { label: 'Tape noise', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Cursor tracking bump', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'paper', name: 'Torn paper', edge: true, note: 'The picture tears away along a fibrous line, leaving a pale paper rim. Every card has a deckled edge; the cursor rips it. The Showreel opens a torn hole from its centre.',
    params: [
      { label: 'Tear roughness (higher = finer)', min: 3, max: 16, step: 0.5, value: 9 },
      { label: 'Fibre rim width', min: 0.005, max: 0.06, step: 0.001, value: 0.02 },
      { label: 'Paper grain', min: 0, max: 1, step: 0.05, value: 0.35 },
      { label: 'Cursor rips the edge', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'burndeckle', name: 'Film burn + deckle edges', edge: true, note: 'Film burn for the melt, torn-paper deckle with a pale fibre rim on every card outline.',
    params: [
      { label: 'Ember width', min: 0.01, max: 0.12, step: 0.005, value: 0.045 },
      { label: 'Burn noise scale (higher = finer)', min: 1, max: 10, step: 0.1, value: 4.5 },
      { label: 'Flicker (more with turning speed)', min: 0, max: 2, step: 0.05, value: 1 },
      { label: 'Deckle width', min: 0.2, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'glyphs', name: 'Glyph mosaic', edge: true, note: 'The melt turns the picture into a grid of letters (T, A, H and a few marks from the page\'s own serif), chosen by brightness; cells shrink away to nothing. The pointer shrinks the grid back to picture. The Showreel becomes a ring of coarse glyphs.',
    params: [
      { label: 'Largest cell, px', min: 6, max: 24, step: 1, value: 14 },
      { label: 'Glyph levels', min: 2, max: 8, step: 1, value: 6 },
      { label: 'Stagger (cells vanish out of step)', min: 0, max: 1, step: 0.05, value: 0.6 },
      { label: 'Cursor shrinks the grid', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'grain', name: 'Grain disintegration', edge: true, note: 'The picture erodes into dust along a noisy front: grains peel off, drift on a flow field and thin out. The cursor scatters grains, turning blows them along. The Showreel crumbles outward from its centre.',
    params: [
      { label: 'Grain size, px', min: 1, max: 6, step: 0.1, value: 2.5 },
      { label: 'Drift', min: 0, max: 0.15, step: 0.005, value: 0.06 },
      { label: 'Edge-lit rim width', min: 0, max: 0.15, step: 0.005, value: 0.05 },
      { label: 'Wind from turning speed', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'ink', name: 'Ink development', edge: true, note: 'The picture goes under wet ink that spreads in feathered tendrils, and develops back out of it. The cursor is the brush: its trail leaves ink. The Showreel is consumed by an ink bloom from its centre.',
    params: [
      { label: 'Ink scale (higher = finer)', min: 1, max: 8, step: 0.1, value: 3 },
      { label: 'Feather', min: 0.02, max: 0.3, step: 0.01, value: 0.12 },
      { label: 'Wet edge (wick)', min: 0, max: 1, step: 0.05, value: 0.5 },
      { label: 'Cursor ink', min: 0, max: 2, step: 0.05, value: 1 },
    ] },
  { key: 'mosaic', name: 'Staggered pixel mosaic', edge: true, note: 'Square blocks grow and drop out one by one in a noisy order, so the melt arrives as scattered blocks. Blocks near the pointer shrink back to picture. The Showreel flips to blocks in a ring.',
    params: [
      { label: 'Smallest block, px', min: 2, max: 8, step: 0.5, value: 4 },
      { label: 'Largest block, px', min: 12, max: 64, step: 1, value: 32 },
      { label: 'Stagger', min: 0, max: 1, step: 0.05, value: 0.6 },
      { label: 'Cursor magnet (blocks shrink)', min: 0, max: 1, step: 0.05, value: 0.5 },
    ] },
  { key: 'shards', name: 'Voronoi shards', edge: true, note: 'The picture cracks into matte, opaque shards that separate, tilt and fall away, nearest the pointer first. No refraction. The Showreel breaks into shards that fall outward from its centre.',
    params: [
      { label: 'Shards across the screen height', min: 6, max: 40, step: 1, value: 16 },
      { label: 'Crack lines', min: 0, max: 1, step: 0.05, value: 0.5 },
      { label: 'Fall distance', min: 0, max: 0.4, step: 0.01, value: 0.15 },
      { label: 'Tilt (shade per shard)', min: 0, max: 1, step: 0.05, value: 0.5 },
    ] },
];
for (const v of VARIANTS) v.values = v.params.map((p) => p.value);

const G = { band: 0.25, far: 0.7, dim: 0.55, meltDur: 1.3, scrollVh: 140, spin: 2.5, pullBack: true, tone: 'dark', camSens: 5, camPinch: 0.35, settle: 0.55 };
G.edgeMode = 1;   // signal front-card edge: 0 clean, 1 scanline (default), 2 teeth
const EDGE_MODES = ['Clean', 'Scanline', 'Teeth'];
const TONES = { dark: [0.063, 0.063, 0.063], light: [0.925, 0.922, 0.906] };
const camCapable = matchMedia('(hover: hover) and (pointer: fine)').matches && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

/* =====================================================================================
   Placeholder footage: procedural 16:9 loops
   ===================================================================================== */
const SCENES = {
  night(c, t, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#04081a'); g.addColorStop(0.55, '#1a2858'); g.addColorStop(0.63, '#e0703a');
    g.addColorStop(0.67, '#1a1020'); g.addColorStop(1, '#07060c');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 46; i++) {

/* Shared by the "edge" materials (burn, halftone, exposure, focus, datamosh, signal, paper, ...).
   OUTLINE: edgeAt(uv) probes the card coverage in uMeta.a at 17 taps (two rings of 8, ~r and ~r/2 px out) and
   returns, for the pixel: mean (blurred coverage, 0 outside .. 1 inside, 0.5 on the outline), band (1 on the
   outline, 0 deep inside or far outside), dir (unit uv vector pointing into the card), n (two noise values,
   anchored to the scrolling cards), jit (a small displacement, strongest on the outline) and src (where to read
   the picture: pulled a little toward the card so pixels just outside can show its edge, plus half the jitter).
   A material feeds this into its TEXTURE or DISPLACEMENT or an outline mask, never into the melt fade m, so the
   fade and the five jobs of meltOf stay exactly as in the older variants. */
const EDGE = `
struct Edge { float band; float mean; vec2 dir; vec2 src; vec2 jit; vec2 n; };
Edge edgeAt(vec2 uv) {
  vec2 px = 1.0 / uRes;
  float r = clamp(uRes.y / 150.0, 4.0, 12.0);
  float acc = textureLod(uMeta, uv, 0.0).a, wsum = 1.0;
  vec2 g = vec2(0.0);
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.785398 + 0.3927;
    vec2 d = vec2(cos(a), sin(a));
    float c1 = textureLod(uMeta, uv + d * px * r, 0.0).a;
    float c2 = textureLod(uMeta, uv + d * px * r * 0.5, 0.0).a;
    acc += c1 + c2 * 1.5; wsum += 2.5;
    g += d * (c1 + c2 * 1.5);
  }
  Edge e;
  e.mean = acc / wsum;
  e.band = 1.0 - pow(abs(2.0 * e.mean - 1.0), 1.6);
  e.dir = g / max(length(g), 1e-3);
  vec2 p = (uv - vec2(0.0, uShift)) * uRes / 11.0;
  e.n = vec2(fbm(p * 0.8) * 0.7 + vnoise(p * 4.0) * 0.3, fbm(p * 0.8 + 41.3));
  e.jit = (e.n - 0.5) * 2.0 * e.band * px * r * 0.9;
  e.src = uv + e.dir * px * r * clamp(1.0 - 2.0 * e.mean, 0.0, 1.0) * 1.7 + e.jit * 0.5;
  return e;
}
// Noisy coverage: 0.5 is the ragged outline, above it is the card. amp 0.6-1.3 = deckle depth (keep <= 1.3).
float edgeS(Edge e, float amp) { return e.mean + (e.n.x - 0.47) * min(amp, 1.3); }
float edgeKeep(Edge e, float amp) { return smoothstep(0.46, 0.54, edgeS(e, amp)); }
float cardCover(vec2 uv) { return textureLod(uMeta, clamp(uv, 0.001, 0.999), 0.0).a; }
vec3 emberCol(float d, float w) { return mix(vec3(0.75, 0.18, 0.04), vec3(1.0, 0.86, 0.6), 1.0 - smoothstep(0.0, w * 0.4, d)); }
// Showreel dissolve: a front that grows from the Showreel's centre. The radius at melt 1 clears the reel's corners.
float reelDist(vec2 uv) { return length((uv - uReelCenter) * vec2(aspect(), 1.0)); }
vec2 reelDir(vec2 uv) { vec2 d = (uv - uReelCenter) * vec2(aspect(), 1.0); return d / max(length(d), 1e-4); }
float reelRadius(float nv, float amp) { return uMelt * 0.85 - 0.03 + (nv - 0.5) * amp * smoothstep(0.0, 0.2, uMelt); }
`;

vec4 shVor(vec2 p) {

  vec2 best = vec2(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {

   Camera finger steering (desktop, opt-in)
   ===================================================================================== */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

  miss: 0, y: null, fx: null, fy: null, ownsPtr: false,
  pinched: false, pstreak: 0, ratio: 0, pinchAt: 0, releasedAt: -1e9, travel: 0, off: { x: 0, y: 0 }, last: null, hist: [] };

function oneEuro(minCutoff = 1.2, beta = 0.02, dCutoff = 1) {
  let x = null, dx = 0, t = 0;
  const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff) / dt);
  return (v, now) => {
    if (x === null) { x = v; t = now; return v; }
    const dt = Math.max((now - t) / 1000, 1e-3); t = now;
    dx += alpha(dCutoff, dt) * ((v - x) / dt - dx);
    x += alpha(minCutoff + beta * Math.abs(dx), dt) * (v - x);
    return x;
  };
}
async function loadRecognizer() {

  const files = await FilesetResolver.forVisionTasks(`${MP}/wasm`);

    baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numHands: 1 });

function drawHand(lm) {

function frame(now) {

  // --- phase: scrubbed zoom → timed melt → committed Helix
  if (phase === 'hero') {
    sSmooth += (clamp(sTarget, 0, 1) - sSmooth) * (1 - Math.exp(-dt * 7));   // time-based: same feel at any frame rate
    if (sTarget >= 0.995 && sSmooth > 0.95) { sSmooth = 1; phase = 'melt'; meltStart = now; meltKick = true; lock(); }
  }
  if (phase === 'melt') {
    meltP = clamp((now - meltStart) / (G.meltDur * 1000), 0, 1);

  }

  $('#state').textContent = `${String.fromCharCode(65 + cur)} ${v.name} · ${phase} · scroll ${clamp(sTarget, 0, 1).toFixed(2)} · zoom ${zoom.toFixed(2)} · melt ${meltP.toFixed(2)} · speed ${speed.toFixed(2)} · front ${cards[front].work + 1}/${works.length} · hover ${hovered >= 0 ? cards[hovered].work + 1 : '–'} · playing ${playing} · ${n} cards${cam.on ? ' · cam ' + cam.status : ''}${floatOk ? '' : ' · NO FLOAT TARGETS'}`;
}

function meltUniforms(M, now, speed, dir, shift) {
  M.f('uRes', W, H).f('uBand', G.band).f('uFar', G.far).f('uDim', G.dim).f('uTime', now / 1000).f('uSpeed', speed).f('uDir', dir).f('uShift', shift);
}

function stepFluid(F, dt, P, speed, dir, shift, now) {
  const texel = [1 / F.w, 1 / F.h], asp = cssW / cssH;
  const ch = progs.fl_churn.use();
  ch.tex('uVel', F.vel.read.tex, 0).tex('uScene', scene.tex, 1).tex('uMeta', scene.meta, 2).tex('uReel', reelT.tex, 3);
  meltUniforms(ch, now, speed, dir, shift);
  ch.f('uDt', dt).f('uChurn', 220 * P[1]).f('uTurn', 1800).f('uMeltForce', phase === 'melt' ? Math.sin(Math.PI * meltP) * 1800 : 0);
  drawQuad(F.vel.write); F.vel.swap();
  if (ptr.x >= 0 && movedPx > 0) {
    const dx = (ptrUv[0] - ptrUvLast[0]) * 6000 * P[0], dy = (ptrUv[1] - ptrUvLast[1]) * 6000 * P[0];
    progs.fl_splat.use().tex('uTarget', F.vel.read.tex, 0).f('uPoint', ...ptrUv).f('uColor', dx, dy, 0).f('uRadius', 0.0025).f('uAspect', asp);
    drawQuad(F.vel.write); F.vel.swap();
  }
  progs.fl_curl.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel); drawQuad(F.curl);
  progs.fl_vort.use().tex('uVel', F.vel.read.tex, 0).tex('uCurl', F.curl.tex, 1).f('uTexel', ...texel).f('uCurlStrength', 60 * P[3]).f('uDt', dt);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_div.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel); drawQuad(F.div);
  progs.fl_scale.use().tex('uSrc', F.pressure.read.tex, 0).f('uK', 0.8); drawQuad(F.pressure.write); F.pressure.swap();
  const pr = progs.fl_pressure.use();
  for (let i = 0; i < 20; i++) {
    pr.tex('uPressure', F.pressure.read.tex, 0).tex('uDiv', F.div.tex, 1).f('uTexel', ...texel);
    drawQuad(F.pressure.write); F.pressure.swap();
  }
  progs.fl_grad.use().tex('uPressure', F.pressure.read.tex, 0).tex('uVel', F.vel.read.tex, 1).f('uTexel', ...texel);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_advVel.use().tex('uVel', F.vel.read.tex, 0).f('uTexel', ...texel).f('uDt', dt).f('uDiss', 2.5);
  drawQuad(F.vel.write); F.vel.swap();
  progs.fl_advDisp.use().tex('uVel', F.vel.read.tex, 0).tex('uD', F.disp.read.tex, 1).f('uTexel', ...texel).f('uDt', dt).f('uRelax', 0.8 + P[2] * 6);
  drawQuad(F.disp.write); F.disp.swap();
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0);
resize();
requestAnimationFrame(frame);
window.__proto = { get phase() { return phase; }, get variant() { return VARIANTS[cur].key; }, setVariant, replay };
</script>
