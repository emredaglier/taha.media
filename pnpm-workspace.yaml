packages:
  - apps/*
  - packages/*

# Security overrides copied from daglier.com: they fix known advisories in transitive
# dependencies. Overrides for packages that aren't installed yet do nothing.
overrides:
  dompurify: '>=3.4.13'
  undici: '>=7.29.1'
  'brace-expansion@5': '>=5.0.12'
  source-map-js: '>=1.2.2'
  '@tailwindcss/typography>postcss-selector-parser': '>=7.1.6'
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0'

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Don't install package versions published in the last 3 days (minutes), so a freshly
# compromised release has time to be caught and pulled. Applies to new resolutions only;
# `--frozen-lockfile` installs are unaffected.
minimumReleaseAge: 4320

engineStrict: true
